<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d"><title id="t">Rivet: make the deal legible</title><desc id="d">Illustrative terminal-style banner. A returns waterfall computed by the app's model at its documented base case (USD mm): entry equity 191.0, plus 389.5 from EBITDA growth, plus 2.7 from multiple change, plus 189.3 from debt paydown, equals exit equity 772.4. Gross MOIC 4.0x, gross IRR 32.2%. Illustrative, not investment advice.</desc><style>text{font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace}.serif{font-family:Georgia,'DejaVu Serif',serif}.b0{transform-box:fill-box;transform-origin:50% 100%;animation:k0 10s ease-in-out infinite}@keyframes k0{0%,80.0%{transform:scaleY(1);opacity:1}83.0%{transform:scaleY(0);opacity:.2}92.0%,100%{transform:scaleY(1);opacity:1}}.b1{transform-box:fill-box;transform-origin:50% 100%;animation:k1 10s ease-in-out infinite}@keyframes k1{0%,80.7%{transform:scaleY(1);opacity:1}83.7%{transform:scaleY(0);opacity:.2}92.7%,100%{transform:scaleY(1);opacity:1}}.b2{transform-box:fill-box;transform-origin:50% 100%;animation:k2 10s ease-in-out infinite}@keyframes k2{0%,81.4%{transform:scaleY(1);opacity:1}84.4%{transform:scaleY(0);opacity:.2}93.4%,100%{transform:scaleY(1);opacity:1}}.b3{transform-box:fill-box;transform-origin:50% 100%;animation:k3 10s ease-in-out infinite}@keyframes k3{0%,82.1%{transform:scaleY(1);opacity:1}85.1%{transform:scaleY(0);opacity:.2}94.1%,100%{transform:scaleY(1);opacity:1}}.b4{transform-box:fill-box;transform-origin:50% 100%;animation:k4 10s ease-in-out infinite}@keyframes k4{0%,82.8%{transform:scaleY(1);opacity:1}85.8%{transform:scaleY(0);opacity:.2}94.8%,100%{transform:scaleY(1);opacity:1}}.cur{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
