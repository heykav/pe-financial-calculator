<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d"><title id="t">Rivet: make the deal legible</title><desc id="d">Rivet banner with base-case app output: 4.0x gross MOIC, 32.2% gross IRR, sponsor equity 191.0 growing to 772.4 (USD mm).</desc><rect width="1280" height="320" fill="#09090b"/><rect x="0" y="0" width="1280" height="4" fill="#d6a84b"/><path d="M56 64l14-30h34l-14 30z" fill="none" stroke="#d6a84b" stroke-width="2.5"/><text x="120" y="60" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">Rivet</text><text x="56" y="132" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">Make the deal legible.</text><text x="56" y="170" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">A browser-only first-pass LBO, DCF and returns calculator.</text><text x="56" y="196" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Formulas are documented and covered by automated tests.</text><circle cx="62" cy="244" r="3.5" fill="#35b779"/><text x="74" y="248" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Local by design</text><circle cx="248" cy="244" r="3.5" fill="#35b779"/><text x="260" y="248" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Transparent mechanics</text><circle cx="434" cy="244" r="3.5" fill="#35b779"/><text x="446" y="248" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Built for first-pass decisions</text><rect x="712" y="48" width="512" height="64" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="732" y="74" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#b7b7c0" text-anchor="start" letter-spacing="1.2">GROSS MOIC</text><text x="732" y="100" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="500" fill="#d6a84b" text-anchor="start" letter-spacing="0">4.0x</text><rect x="712" y="124" width="512" height="64" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="732" y="150" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#b7b7c0" text-anchor="start" letter-spacing="1.2">GROSS IRR</text><text x="732" y="176" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="500" fill="#d6a84b" text-anchor="start" letter-spacing="0">32.2%</text><rect x="712" y="200" width="512" height="64" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="732" y="226" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#b7b7c0" text-anchor="start" letter-spacing="1.2">SPONSOR EQUITY</text><text x="732" y="252" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="500" fill="#d6a84b" text-anchor="start" letter-spacing="0">$191.0 to $772.4</text><text x="712" y="286" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Base case, app output: EV 425, EBITDA 52, 4.5x debt @ 8.25%, 5-yr hold, 8.2x exit. Gross; illustrative.</text></svg>