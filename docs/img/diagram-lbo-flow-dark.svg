ing), solved by iteration</text><text x="338" y="351" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">cash = 65% x EBITDA - interest</text><text x="338" y="368" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">mandatory = 1% x 234.0 = 2.34 per year</text><text x="338" y="385" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">sweep = 100% x (cash - mandatory)</text><text x="338" y="402" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">closing = opening - mandatory - sweep</text><text x="846" y="156" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Exit EBITDA (yr 5)</text><text x="1010" y="178" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#fafafa" text-anchor="end" letter-spacing="0">99.7</text><text x="846" y="214" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">x exit multiple</text><text x="1010" y="236" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#fafafa" text-anchor="end" letter-spacing="0">8.2x</text><path d="M846 256H1010" stroke="#27272a"/><text x="846" y="272" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Exit EV</text><text 