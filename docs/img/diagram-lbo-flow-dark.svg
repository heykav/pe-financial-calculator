<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 536" width="1280" height="536" role="img" aria-labelledby="t d"><title id="t">Rivet LBO flow: sources and uses, debt schedule, exit equity, MOIC and IRR</title><desc id="d">Four stages with base-case values from model.js: sponsor equity 191.0 and debt 234.0 fund a 425.0 purchase; the debt falls to 44.7 by year 5; exit equity is 772.4, giving 4.0x MOIC and 32.2% IRR.</desc><rect width="1280" height="536" fill="#09090b"/><text x="32" y="44" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">From deal inputs to MOIC and IRR</text><text x="32" y="68" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Base case, values produced by model.js (USD mm). Inputs: EV 425.0 · EBITDA 52.0 · 4.5x debt @ 8.25% · 5-yr hold · 8.2x exit · growth 12/11/10/9/8% · margin 21→25%.</text><rect x="32" y="96" width="262" height="392" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="48" y="124" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d6a84b" text-anchor="start" letter-spacing="0">1  Sources &amp; uses</text><rect x="322" y="96" width="478" height="392" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="338" y="124" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d6a84b" text-anchor="start" letter-spacing="0">2  Debt schedule, years 1-5</text><rect x="830" y="96" width="196" height="392" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="846" y="124" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d6a84b" text-anchor="start" letter-spacing="0">3  Exit equity, year 5</text><rect x="1054" y="96" width="194" height="392" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="1070" y="124" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d6a84b" text-anchor="start" letter-spacing="0">4  Sponsor returns (gross)</text><path d="M294 292H316" stroke="#d6a84b" stroke-width="1.5" fill="none"/><path d="M313 287L320 292L313 297" stroke="#d6a84b" stroke-width="1.5" fill="none"/><path d="M800 292H824" stroke="#d6a84b" stroke-width="1.5" fill="none"/><path d="M821 287L828 292L821 297" stroke="#d6a84b" stroke-width="1.5" fill="none"/><path d="M1026 292H1048" stroke="#d6a84b" stroke-width="1.5" fill="none"/><path d="M1045 287L1052 292L1045 297" stroke="#d6a84b" stroke-width="1.5" fill="none"/><text x="48" y="154" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#b7b7c0" text-anchor="start" letter-spacing="1.2">USES</text><text x="48" y="178" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Purchase EV</text><text x="278" y="178" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#fafafa" text-anchor="end" letter-spacing="0">425.0</text><text x="48" y="202" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Fees</text><text x="278" y="202" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#fafafa" text-anchor="end" letter-spacing="0">0.0</text><path d="M48 212H278" stroke="#27272a"/><text x="48" y="228" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fafafa" text-ancho