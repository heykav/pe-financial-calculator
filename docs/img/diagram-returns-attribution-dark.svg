<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d"><title id="t">Returns attribution identity</title><desc id="d">Waterfall from entry equity 191.0 through EBITDA growth +389.5, multiple change +2.7 and debt paydown +189.3 to exit equity 772.4, at the documented base case.</desc><rect width="1280" height="560" fill="#09090b"/><text x="32" y="44" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">Returns attribution identity</text><text x="32" y="68" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Base case, values produced by model.js (USD mm). Inputs: EV 425.0 · EBITDA 52.0 · 4.5x debt @ 8.25% · 5-yr hold · 8.2x exit · growth 12/11/10/9/8% · margin 21→25%.</text><rect x="32" y="88" width="1216" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/><text x="52" y="120" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0">Exit equity - Entry equity  =  (E1 - E0) x M0   +   (M1 - M0) x E1   +   (ND0 - ND1)   -   fees</text><path d="M40 440H720" stroke="#27272a"/><rect x="60" y="379.7" width="88" height="60.3" rx="3" fill="#6f7f86"/><text x="104.0" y="371.6669885925651" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">191.0</text><text x="104.0" y="462" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="middle" letter-spacing="0">Entry equity</text><rect x="188" y="256.6" width="88" height="123.0" rx="3" fill="#d6a84b"/><text x="232.0" y="248.63039015440108" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">+389.5</text><text x="232.0" y="462" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="middle" letter-spacing="0">EBITDA growth</text><rect x="316" y="255.8" width="88" height="2.0" rx="3" fill="#d6a84b"/><text x="360.0" y="247.78286162702463" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">+2.7</text><text x="360.0" y="462" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="middle" letter-spacing="0">Multiple</text><rect x="444" y="196.0" width="88" height="59.8" rx="3" fill="#d6a84b"/><text x="488.0" y="188.00000000000003" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">+189.3</text><text x="488.0" y="462" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="middle" letter-spacing="0">Debt paydown</text><rect x="572" y="196.0" width="88" height="244.0" rx="3" fill="#fafafa" opacity=".9"/><text x="616.0" y="188.0" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#fafafa" text-anchor="middle" letter-spacing="0">772.4</text><text x="616.0" y="462" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="middle" letter-spacing="0">Exit equity</text><text x="60" y="492" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">M0 = 425.0 / 52.0 = 8.17x, M1 = 8.2x, E1 = 99.7 (year-5 EBITDA). The cross term sits in the multiple leg.</text><rect x="760" y="164" width="488" height="66" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="776" y="190" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">EBITDA growth at entry multiple</text><text x="776" y="212" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">(99.7 - 52.0) x 8.17x</text><text x="1232" y="194" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="500" fill="#d6a84b" text-anchor="end" letter-spacing="0">+389.5</text><text x="1232" y="214" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b7b7c0" text-anchor="end" letter-spacing="0">67.0% of value created</text><rect x="760" y="242" width="488" height="66" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="776" y="268" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">Multiple change on exit EBITDA</text><text x="776" y="290" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">(8.2x - 8.17x) x 99.7</text><text x="1232" y="272" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="500" fill="#d6a84b" text-anchor="end" letter-spacing="0">+2.7</text><text x="1232" y="292" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b7b7c0" text-anchor="end" letter-spacing="0">0.5% of value created</text><rect x="760" y="320" width="488" height="66" rx="8" fill="#101012" stroke="#27272a" stroke-width="1"/><text x="776" y="346" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">Net-debt reduction</text><text x="776" y="368" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">234.0 - 44.7</text><text x="1232" y="350" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="500" fill="#d6a84b" text-anchor="end" letter-spacing="0">+189.3</text><text x="1232" y="370" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b7b7c0" text-anchor="end" letter-spacing="0">32.5% of value created</text><rect x="760" y="398" width="488" height="66" rx="8" fill="#2b2417" stroke="#d6a84b" stroke-width="1"/><text x="776" y="424" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0">Total value created</text><text x="776" y="446" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">fees = 0.0 in the app; 191.0 + 581.4 = 772.4</text><text x="1232" y="436" font-family="DM Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="500" fill="#d6a84b" text-anchor="end" letter-spacing="0">+581.4</text><text x="32" y="538" font-family="IBM Plex Sans,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#b7b7c0" text-anchor="start" letter-spacing="0">Exact identity, no clamping (shares shown only when total value creation is positive). Gross returns; see docs/formulas.md.</text></svg>