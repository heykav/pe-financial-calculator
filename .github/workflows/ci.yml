name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check model.js
          node --check app.js
          node --check ui-helpers.js
          node --check scripts/make_screenshots.mjs
      - name: Unit tests (calculation layer and UI helpers)
        run: npm test
